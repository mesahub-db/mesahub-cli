name: Check

# @mesahub/client is not yet published to npm.
# We check out the public client repo, build it, then patch the CLI package.json
# to use a local file: reference before building the CLI.

on:
  push:
    branches:
      - trunk
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4
        with:
          path: cli

      - name: Checkout @mesahub/client (public)
        uses: actions/checkout@v4
        with:
          repository: mesahub-db/mesahub-pkg-node
          path: client

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Allow esbuild build scripts
        working-directory: client
        run: echo 'dangerouslyAllowAllBuilds=true' >> .npmrc

      - name: Build @mesahub/client
        working-directory: client
        run: pnpm install && pnpm build

      - name: Patch CLI to use local client
        working-directory: cli
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.dependencies['@mesahub/client'] = 'file:../client';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Install CLI
        working-directory: cli
        run: pnpm install

      - name: Build CLI
        working-directory: cli
        run: pnpm build

      - name: Log success
        run: echo "✅ CLI build OK"
